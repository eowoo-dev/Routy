openapi: 3.0.3
info:
  title: Routy API
  version: 0.1.0
  contact:
    name: EoWoo
    url: https://eowoo.org
servers:
  - url: https://eowoo.org
    description: EoWoo production API
  - url: http://localhost:3000
    description: Local development API
paths:
  /api/driving-records/{sessionId}/parts/{index}:
    put:
      operationId: putDrivingRecordPart
      summary: Idempotently upload one contiguous archive part (196608 decoded bytes maximum)
      security: [{installationBearer: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: index, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 99999999}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DrivingRecordPartInput'}
      responses:
        '200':
          description: Persisted or matching existing part
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordPartReceipt'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '413': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/driving-records/{sessionId}/complete:
    post:
      operationId: completeDrivingRecord
      summary: Publish one trip only after every archive part and whole archive hash match
      security: [{installationBearer: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DrivingRecordCompletion'}
      responses:
        '201':
          description: Completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordReceipt'}
        '200':
          description: Idempotent completion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordReceipt'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '413': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/driving-records/{sessionId}/archive:
    get:
      operationId: downloadDrivingRecordArchive
      security: [{installationBearer: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Stream of complete per-window reports as NDJSON, bounded memory
          content:
            application/x-ndjson:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
  /api/account/driving-records/{sessionId}/archive:
    get:
      operationId: downloadAccountDrivingRecordArchive
      security: [{accountCookie: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Linked account full report stream
          content:
            application/x-ndjson:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
  /api/auth/register:
    post:
      operationId: registerAccount
      summary: Create an email account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountSignupInput'}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSessionResponse'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/auth/login:
    post:
      operationId: loginAccount
      summary: Sign in on the web
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountLoginInput'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSessionResponse'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/auth/session:
    get:
      operationId: getAccountSession
      summary: Read current web session
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSessionResponse'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/auth/logout:
    post:
      operationId: logoutAccount
      summary: Revoke current web session
      security: [{accountCookie: []}]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkReceipt'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/vehicle-connection:
    get:
      operationId: getVehicleConnection
      summary: Read linked account display name
      security: [{installationBearer: []}]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleConnection'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/vehicle-pairings:
    post:
      operationId: createVehiclePairing
      summary: Issue a five-minute one-use pairing code
      security: [{installationBearer: []}]
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehiclePairingChallenge'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/account/vehicle:
    get:
      operationId: getAccountVehicle
      summary: Read the account linked vehicle
      security: [{accountCookie: []}]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountVehicleResponse'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/account/pairings/preview:
    post:
      operationId: previewVehiclePairing
      summary: Preview before confirming the connection
      security: [{accountCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingCodeInput'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingPreview'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/account/pairings/claim:
    post:
      operationId: claimVehiclePairing
      summary: Confirm one account and one vehicle connection
      security: [{accountCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingClaimInput'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingClaimReceipt'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/account/driving-records:
    get:
      operationId: listAccountDrivingRecords
      summary: Read records owned by this account
      security: [{accountCookie: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50}}
        - {in: query, name: cursor, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordPage'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '403': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
        '429': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/account/driving-records/{sessionId}:
    get:
      operationId: getAccountDrivingRecord
      security: [{accountCookie: []}]
      parameters:
        - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Account-owned record detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordDetail'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/vehicle-installations:
    post:
      operationId: registerVehicleInstallation
      summary: Register a guest vehicle installation; same credentials are idempotent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleInstallationRegistration'}
      responses:
        '201':
          description: Installation registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleInstallationReceipt'}
        '200':
          description: Same installation credentials already registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehicleInstallationReceipt'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '413': {$ref: '#/components/responses/ApiFailure'}
        '415': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/driving-records:
    get:
      operationId: listDrivingRecords
      summary: List this installation's completed records, newest first
      security: [{installationBearer: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: cursor, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Record summaries; pass nextCursor for the next page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordPage'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /api/driving-records/{sessionId}:
    parameters:
      - {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: putDrivingRecord
      summary: Create an immutable completed record; identical retries return the same receipt
      security: [{installationBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DrivingRecordUpload'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordReceipt'}
        '200':
          description: Identical record already saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordReceipt'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '413': {$ref: '#/components/responses/ApiFailure'}
        '415': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
    get:
      operationId: getDrivingRecord
      summary: Read this installation's completed record and full evaluation snapshot
      security: [{installationBearer: []}]
      responses:
        '200':
          description: Record detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrivingRecordDetail'}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '503': {$ref: '#/components/responses/ApiFailure'}
  /routy/scenarios/state:
    get:
      operationId: getScenarioState
      summary: Read the development-only synthetic scenario controller
      responses:
        '200':
          description: Controller state and available scenarios
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScenarioState'}
  /routy/scenarios/control:
    post:
      operationId: controlScenario
      summary: Control synthetic scenarios without writing SDK vehicle properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [select, start, stop, reset, release]}
                id: {type: string, description: Required for select}
      responses:
        '200':
          description: Updated synthetic controller state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScenarioState'}
        '409':
          description: Unknown scenario or invalid state transition
  /api/health:
    get:
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is available (does not check the database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    accountCookie:
      type: apiKey
      in: cookie
      name: routy_session
      description: HttpOnly SameSite=Lax session cookie; Secure on HTTPS production
    installationBearer:
      type: http
      scheme: bearer
      description: Installation UUID followed by a dot and its locally generated 256-bit secret; HTTPS required outside local debug
  responses:
    ApiFailure:
      description: Structured API failure; 429 and 5xx are retryable, other 4xx need attention
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    AccountProfile:
      type: object
      required: [id, email, displayName]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
    AccountSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          allOf: [{$ref: '#/components/schemas/AccountProfile'}]
          nullable: true
    AccountSignupInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 10, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 30}
    AccountLoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 10, maxLength: 128}
    OkReceipt:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    VehicleConnection:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [unlinked, connected]}
        ownerName: {type: string, nullable: true}
    VehiclePairingChallenge:
      type: object
      required: [id, code, expiresAt, expiresInSeconds, verificationUri]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, minLength: 8, maxLength: 8, description: Uppercase letters and digits without ambiguous characters}
        expiresAt: {type: string, format: date-time}
        expiresInSeconds: {type: integer}
        verificationUri: {type: string, format: uri, description: Public first-party web URL with only the one-use code}
    AccountVehicleResponse:
      type: object
      required: [vehicle]
      properties:
        vehicle:
          type: object
          nullable: true
          required: [id, label]
          properties:
            id: {type: string, format: uuid}
            label: {type: string}
    PairingCodeInput:
      type: object
      required: [code]
      properties:
        code: {type: string, description: Eight characters; spaces and a hyphen are accepted}
    PairingClaimInput:
      type: object
      required: [code, consent]
      properties:
        code: {type: string}
        consent: {type: boolean}
    PairingPreview:
      type: object
      required: [vehicleLabel, expiresAt]
      properties:
        vehicleLabel: {type: string}
        expiresAt: {type: string, format: date-time}
    PairingClaimReceipt:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    VehicleInstallationRegistration:
      type: object
      additionalProperties: false
      required: [installationId, secret]
      properties:
        installationId: {type: string, format: uuid}
        secret: {type: string, pattern: '^[a-f0-9]{64}$', description: Generated and saved on the client before registration; only a hash is stored on the server}
    VehicleInstallationReceipt:
      type: object
      required: [installationId]
      properties:
        installationId: {type: string, format: uuid}
    DrivingRecordUpload:
      type: object
      additionalProperties: false
      required: [schemaVersion, origin, startedAt, endedAt, durationMs, engineVersion, ruleVersion, report]
      properties:
        schemaVersion: {type: integer, minimum: 1, maximum: 1}
        origin: {type: string, enum: [LIVE, SYNTHETIC]}
        startedAt: {type: string, format: date-time, description: UTC wall clock; distinct from report monotonic times}
        endedAt: {type: string, format: date-time}
        durationMs: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        engineVersion: {type: string, maxLength: 32}
        ruleVersion: {type: string, maxLength: 64}
        environmentRuleVersion: {type: string, maxLength: 64, nullable: true}
        scenarioId: {type: string, maxLength: 64, nullable: true}
        report:
          type: object
          additionalProperties: true
          description: Versioned evaluation summary with metrics, assessments, grouped coaching and original events. No raw telemetry or installation secret. startMs/endMs are monotonic, duration matches envelope. Client evaluation, not server-certified driving accuracy.
    DrivingRecordPartInput:
      type: object
      additionalProperties: false
      required: [sha256, data]
      properties:
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        data: {type: string, format: byte, maxLength: 262144}
    DrivingRecordPartReceipt:
      type: object
      required: [index, sha256]
      properties:
        index: {type: integer, minimum: 0}
        sha256: {type: string}
    DrivingRecordArchive:
      type: object
      additionalProperties: false
      required: [parts, bytes, sha256]
      properties:
        parts: {type: integer, minimum: 1, maximum: 100000000}
        bytes: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    DrivingRecordCompletion:
      type: object
      additionalProperties: false
      required: [record, archive]
      properties:
        record: {$ref: '#/components/schemas/DrivingRecordUpload'}
        archive: {$ref: '#/components/schemas/DrivingRecordArchive'}
    DrivingRecordReceipt:
      type: object
      required: [id, sessionId, receivedAt]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        receivedAt: {type: string, format: date-time}
    DrivingRecordSummary:
      type: object
      required: [id, sessionId, receivedAt, schemaVersion, origin, startedAt, endedAt, durationMs, engineVersion, ruleVersion]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        receivedAt: {type: string, format: date-time}
        schemaVersion: {type: integer}
        origin: {type: string, enum: [LIVE, SYNTHETIC]}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        durationMs: {type: integer, format: int64}
        engineVersion: {type: string}
        ruleVersion: {type: string}
        environmentRuleVersion: {type: string, nullable: true}
        scenarioId: {type: string, nullable: true}
    DrivingRecordDetail:
      allOf:
        - {$ref: '#/components/schemas/DrivingRecordSummary'}
        - type: object
          required: [report]
          properties:
            report: {type: object, additionalProperties: true}
            archive: {$ref: '#/components/schemas/DrivingRecordArchive'}
            reviewPreview:
              type: object
              additionalProperties: true
              description: Derived bounded review for legacy archives; the immutable report is unchanged.
    DrivingRecordPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DrivingRecordSummary'}}
        nextCursor: {type: string, format: uuid, nullable: true}
    ScenarioState:
      type: object
      required: [status, durationMs, count, checks]
      properties:
        status: {type: string, enum: [idle, ready, running, stopped, completed]}
        scenarioId: {type: string, nullable: true}
        durationMs: {type: integer, minimum: 0}
        count: {type: integer, minimum: 0}
        frame:
          allOf:
            - {$ref: '#/components/schemas/EnvironmentFrame'}
          nullable: true
        checks:
          type: array
          items:
            type: object
            required: [label, passed]
            properties:
              label: {type: string}
              passed: {type: boolean}
        scenarios:
          type: array
          items:
            type: object
            required: [id, title, description, durationMs, expected, forbidden]
            properties:
              id: {type: string}
              title: {type: string}
              description: {type: string}
              durationMs: {type: integer}
              expected: {type: array, items: {type: string}}
              forbidden: {type: array, items: {type: string}}
    EnvironmentVehicle:
      type: object
      additionalProperties: false
      required: [id, s, d, speed, length, width]
      properties:
        id: {type: string, minLength: 1}
        s: {type: number, description: 'Body center forward position in metres'}
        d: {type: number, description: 'Body center lateral position in metres, positive left'}
        speed: {type: number, minimum: 0}
        length: {type: number, minimum: 0.1}
        width: {type: number, minimum: 0.1}
    EnvironmentFrame:
      type: object
      additionalProperties: false
      description: Straight three-lane synthetic environment. atMs is simulation time; generatedAtMs uses the server monotonic clock.
      required: [version, source, runId, sequence, atMs, s, d, heading, speed, signal, vehicles, light, stopLineS, available]
      properties:
        version: {type: integer, enum: [2]}
        source: {type: string, enum: [SIMULATED_ENVIRONMENT]}
        runId: {type: string, minLength: 1}
        sequence: {type: integer, format: int64, minimum: 0}
        atMs: {type: integer, format: int64, minimum: 0}
        generatedAtMs: {type: integer, format: int64, minimum: 0}
        s: {type: number}
        d: {type: number}
        heading: {type: number, description: 'Radians, positive left of the straight road'}
        speed: {type: number, minimum: 0, maximum: 60}
        signal: {type: string, enum: ['OFF', 'LEFT', 'RIGHT', 'UNKNOWN']}
        vehicles:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentVehicle'}
        light: {type: string, enum: [RED, YELLOW, GREEN]}
        stopLineS: {type: number}
        available: {type: boolean}
    EnvironmentTrace:
      type: object
      required: [frames]
      properties:
        frames:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentFrame'}
    EnvironmentClock:
      type: object
      required: [serverAtMs]
      properties:
        serverAtMs: {type: integer, format: int64, minimum: 0}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          type: string
