name: routy-dev

services:
  virtual-console:
    image: node:26.12.1-bookworm-slim
    init: true
    working_dir: /workspace
    command: [node, infra/virtual-console/proxy.mjs]
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8090}:8090"
    environment:
      CONSOLE_UPSTREAM: http://host.docker.internal:8088
    volumes:
      - ./infra/virtual-console:/workspace/infra/virtual-console:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/routy/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  pleos:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/pleos/Dockerfile.build
    init: true
    environment:
      ROUTY_API_BASE_URL: ${ROUTY_API_BASE_URL:-http://127.0.0.1:3000}
    volumes:
      - .:/workspace
      - pleos-gradle-cache:/root/.gradle
      - pleos-android-user:/root/.android
      - pleos-project-cache:/workspace/apps/pleos/.gradle
      - pleos-kotlin-cache:/workspace/apps/pleos/.kotlin
    command: [":app:assembleDebug"]
  web:
    build:
      context: .
      dockerfile: infra/services/Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://routy:routy_local@db:5432/routy?schema=public
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - contracts-node-modules:/workspace/packages/contracts/node_modules
      - next-cache:/workspace/apps/web/.next
      - pnpm-store:/workspace/.pnpm-store
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: routy
      POSTGRES_PASSWORD: routy_local
      POSTGRES_DB: routy
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U routy -d routy]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pleos-gradle-cache:
  pleos-android-user:
  pleos-project-cache:
  pleos-kotlin-cache:
  root-node-modules:
  web-node-modules:
  contracts-node-modules:
  next-cache:
  pnpm-store:
  postgres-data:
